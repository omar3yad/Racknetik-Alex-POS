{% extends "base.html" %}

{% block title %}لوحة تحكم المشغل{% endblock %}

{% block content %}
<div class="flex-grow flex flex-col items-center justify-center p-6 bg-gray-950">
    <div class="w-full max-w-2xl bg-gray-800 border border-gray-700 rounded-2xl shadow-xl p-8 text-center">
        <h1 class="text-3xl font-bold mb-2">مرحباً، {{ user.full_name }}</h1>
        <p class="text-indigo-400 font-semibold mb-6">بوابة رقم: {{ user.gate_number }}</p>
        
        <div class="bg-gray-900 border border-gray-700/60 rounded-xl p-8 text-gray-400">
            <svg class="w-12 h-12 mx-auto mb-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
            </svg>
            <p class="text-lg">لا توجد بيانات بعد</p>
        </div>
    </div>
</div>
{% endblock %}
